<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TAP Interactive Guides — The Affluence Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: #FDFCFA; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SECTIONS = [
      {
        id: "students",
        label: "Students",
        emoji: "\u{1F331}",
        tagline: "Build the foundation before the real world hits.",
        color: "#5A7C65",
        colorLight: "#EEF3EF",
        colorAccent: "#A8C5B0",
        tiles: [
          { title: "Your First Budget", desc: "Map your money before it maps you.", icon: "\u{1F4D2}" },
          { title: "Credit from Scratch", desc: "Build your score with zero history.", icon: "\u{1F4C8}" },
          { title: "Student Loans Decoded", desc: "Know what you owe and why it matters.", icon: "\u{1F393}" },
          { title: "Filing Taxes 101", desc: "First time filing? Start here.", icon: "\u{1F9FE}" },
          { title: "Reading a Paycheck", desc: "Where does your money actually go?", icon: "\u{1F4B5}" },
          { title: "Banking Basics", desc: "Checking, savings, and what to watch for.", icon: "\u{1F3E6}" },
        ],
      },
      {
        id: "young-professionals",
        label: "Young Professionals",
        emoji: "\u{1F680}",
        tagline: "You\u2019re earning real money \u2014 now make it work.",
        color: "#8B7234",
        colorLight: "#F7F3EA",
        colorAccent: "#D4BA6A",
        tiles: [
          { title: "Benefits Breakdown", desc: "Decode your offer beyond the salary.", icon: "\u{1F4CB}" },
          { title: "Rent vs. Buy", desc: "Real math, not opinions.", icon: "\u{1F3E0}" },
          { title: "Debt vs. Investing", desc: "Where should your next dollar go?", icon: "\u2696\uFE0F" },
          { title: "Car Buying Smart", desc: "Mobility without wrecking your wealth.", icon: "\u{1F697}" },
          { title: "Lifestyle Creep Check", desc: "Small habits, big consequences.", icon: "\u2615" },
          { title: "Career Moves That Pay", desc: "Strategic leaps over comfortable traps.", icon: "\u{1F4BC}" },
        ],
      },
      {
        id: "parents",
        label: "Parents",
        emoji: "\u{1F3AF}",
        tagline: "Protect your family\u2019s future with clarity.",
        color: "#6B5B8A",
        colorLight: "#F2EFF6",
        colorAccent: "#B8A9D4",
        tiles: [
          { title: "Talk Money by Age", desc: "Conversation starters for every stage.", icon: "\u{1F4AC}" },
          { title: "529 & College Savings", desc: "Plan before the tuition bill lands.", icon: "\u{1F392}" },
          { title: "Family Budget Workshop", desc: "One household, one plan.", icon: "\u{1F4CA}" },
          { title: "Wills & Estate Basics", desc: "The conversation nobody wants to have.", icon: "\u{1F4DC}" },
          { title: "Co-Parenting & Finances", desc: "Shared kids, shared clarity.", icon: "\u{1F91D}" },
          { title: "Spending With Purpose", desc: "Joy without justification spirals.", icon: "\u{1F389}" },
        ],
      },
    ];

    function useInView(ref) {
      const [visible, setVisible] = useState(false);
      useEffect(() => {
        if (!ref.current) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setVisible(true);
              observer.disconnect();
            }
          },
          { threshold: 0.15 }
        );
        observer.observe(ref.current);
        return () => observer.disconnect();
      }, [ref]);
      return visible;
    }

    function TileCard({ tile, section, delay, visible }) {
      const [hovered, setHovered] = useState(false);

      return (
        <button
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          onClick={() => {}}
          style={{
            all: "unset",
            cursor: "pointer",
            display: "flex",
            flexDirection: "column",
            background: "#FFFFFF",
            border: `1.5px solid ${hovered ? section.color : "#E8E4DE"}`,
            borderRadius: 16,
            padding: "28px 24px",
            transition: "all 0.35s cubic-bezier(0.22, 1, 0.36, 1)",
            transform: visible
              ? hovered ? "translateY(-4px)" : "translateY(0)"
              : "translateY(24px)",
            opacity: visible ? 1 : 0,
            transitionDelay: `${delay}s`,
            boxShadow: hovered
              ? `0 12px 32px ${section.color}18, 0 2px 8px rgba(0,0,0,0.06)`
              : "0 1px 3px rgba(0,0,0,0.04)",
            boxSizing: "border-box",
            position: "relative",
            overflow: "hidden",
          }}
        >
          <div
            style={{
              position: "absolute",
              top: 0,
              left: 0,
              right: 0,
              height: 3,
              background: section.color,
              transform: hovered ? "scaleX(1)" : "scaleX(0)",
              transformOrigin: "left",
              transition: "transform 0.35s cubic-bezier(0.22, 1, 0.36, 1)",
            }}
          />
          <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 12 }}>
            <div
              style={{
                width: 44,
                height: 44,
                borderRadius: 12,
                background: hovered ? `${section.colorAccent}33` : section.colorLight,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 22,
                flexShrink: 0,
                transition: "background 0.3s ease",
              }}
            >
              {tile.icon}
            </div>
            <h3
              style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 17,
                fontWeight: 700,
                color: "#1A1A1A",
                margin: 0,
                lineHeight: 1.3,
              }}
            >
              {tile.title}
            </h3>
          </div>
          <p
            style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 14,
              color: "#6B6B6B",
              margin: "0 0 16px 0",
              lineHeight: 1.55,
              flex: 1,
            }}
          >
            {tile.desc}
          </p>
          <div
            style={{
              display: "flex",
              alignItems: "center",
              gap: hovered ? 10 : 6,
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 13,
              fontWeight: 600,
              color: section.color,
              transition: "gap 0.3s ease",
            }}
          >
            Start Guide
            <span
              style={{
                transition: "transform 0.3s ease",
                display: "inline-block",
                transform: hovered ? "translateX(2px)" : "translateX(0)",
              }}
            >
              →
            </span>
          </div>
        </button>
      );
    }

    function SectionBlock({ section, index }) {
      const ref = useRef(null);
      const visible = useInView(ref);
      const isEven = index % 2 === 0;

      return (
        <section
          ref={ref}
          style={{
            padding: "80px 0",
            background: isEven ? "#FDFCFA" : section.colorLight,
            position: "relative",
            overflow: "hidden",
          }}
        >
          <div
            style={{
              position: "absolute",
              top: 0,
              right: isEven ? 0 : "auto",
              left: isEven ? "auto" : 0,
              width: 200,
              height: 200,
              background: `radial-gradient(circle at ${isEven ? "top right" : "top left"}, ${section.colorAccent}22, transparent 70%)`,
              pointerEvents: "none",
            }}
          />
          <div style={{ maxWidth: 1120, margin: "0 auto", padding: "0 24px" }}>
            <div
              style={{
                opacity: visible ? 1 : 0,
                transform: visible ? "translateY(0)" : "translateY(30px)",
                transition: "all 0.7s cubic-bezier(0.22, 1, 0.36, 1)",
                marginBottom: 48,
              }}
            >
              <div
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 10,
                  background: section.color,
                  color: "#fff",
                  padding: "8px 20px",
                  borderRadius: 100,
                  fontSize: 13,
                  fontFamily: "'DM Sans', sans-serif",
                  fontWeight: 600,
                  letterSpacing: "0.06em",
                  textTransform: "uppercase",
                  marginBottom: 16,
                }}
              >
                <span style={{ fontSize: 16 }}>{section.emoji}</span>
                {section.label}
              </div>
              <h2
                style={{
                  fontFamily: "'Playfair Display', serif",
                  fontSize: "clamp(28px, 4vw, 42px)",
                  fontWeight: 700,
                  color: "#1A1A1A",
                  margin: "0 0 8px 0",
                  lineHeight: 1.2,
                }}
              >
                {section.tagline}
              </h2>
              <div style={{ width: 48, height: 3, background: section.color, borderRadius: 2 }} />
            </div>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
                gap: 20,
              }}
            >
              {section.tiles.map((tile, i) => (
                <TileCard key={tile.title} tile={tile} section={section} delay={i * 0.08} visible={visible} />
              ))}
            </div>
          </div>
        </section>
      );
    }

    function NavPill({ sections, active, onSelect }) {
      return (
        <div
          style={{
            position: "sticky",
            top: 0,
            zIndex: 100,
            background: "rgba(253, 252, 250, 0.85)",
            backdropFilter: "blur(16px)",
            WebkitBackdropFilter: "blur(16px)",
            borderBottom: "1px solid #E8E4DE",
            padding: "0 24px",
          }}
        >
          <div
            style={{
              maxWidth: 1120,
              margin: "0 auto",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              height: 60,
            }}
          >
            <div
              style={{
                fontFamily: "'Playfair Display', serif",
                fontSize: 18,
                fontWeight: 700,
                color: "#1A1A1A",
                display: "flex",
                alignItems: "center",
                gap: 8,
              }}
            >
              <span
                style={{
                  background: "linear-gradient(135deg, #5A7C65, #8B7234)",
                  WebkitBackgroundClip: "text",
                  WebkitTextFillColor: "transparent",
                }}
              >
                TAP
              </span>
              <span style={{ color: "#999", fontWeight: 400, fontSize: 14, fontFamily: "'DM Sans', sans-serif" }}>
                Interactive Guides
              </span>
            </div>
            <nav style={{ display: "flex", gap: 4 }}>
              {sections.map((s) => (
                <button
                  key={s.id}
                  onClick={() => onSelect(s.id)}
                  style={{
                    all: "unset",
                    cursor: "pointer",
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 13,
                    fontWeight: active === s.id ? 700 : 500,
                    color: active === s.id ? s.color : "#888",
                    padding: "8px 16px",
                    borderRadius: 100,
                    background: active === s.id ? s.colorLight : "transparent",
                    transition: "all 0.25s ease",
                    whiteSpace: "nowrap",
                  }}
                >
                  <span style={{ marginRight: 5 }}>{s.emoji}</span>
                  {s.label}
                </button>
              ))}
            </nav>
          </div>
        </div>
      );
    }

    function TAPGuidesHome() {
      const [activeSection, setActiveSection] = useState(null);

      const scrollTo = (id) => {
        setActiveSection(id);
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      useEffect(() => {
        const handler = () => {
          for (const s of SECTIONS) {
            const el = document.getElementById(s.id);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top < 300 && rect.bottom > 200) {
                setActiveSection(s.id);
                break;
              }
            }
          }
        };
        window.addEventListener("scroll", handler, { passive: true });
        return () => window.removeEventListener("scroll", handler);
      }, []);

      return (
        <div style={{ background: "#FDFCFA", minHeight: "100vh" }}>
          {/* Hero */}
          <header
            style={{
              position: "relative",
              padding: "100px 24px 80px",
              textAlign: "center",
              overflow: "hidden",
              background: "linear-gradient(180deg, #FDFCFA 0%, #F5F1EB 100%)",
            }}
          >
            <div
              style={{
                position: "absolute",
                top: -60,
                left: "10%",
                width: 240,
                height: 240,
                borderRadius: "50%",
                background: "radial-gradient(circle, #A8C5B015, transparent 70%)",
                pointerEvents: "none",
              }}
            />
            <div
              style={{
                position: "absolute",
                bottom: -40,
                right: "15%",
                width: 180,
                height: 180,
                borderRadius: "50%",
                background: "radial-gradient(circle, #D4BA6A12, transparent 70%)",
                pointerEvents: "none",
              }}
            />
            <div
              style={{
                display: "inline-block",
                fontFamily: "'DM Sans', sans-serif",
                fontSize: 12,
                fontWeight: 600,
                letterSpacing: "0.12em",
                textTransform: "uppercase",
                color: "#8B7234",
                background: "#8B723412",
                padding: "6px 18px",
                borderRadius: 100,
                marginBottom: 24,
              }}
            >
              The Affluence Project
            </div>
            <h1
              style={{
                fontFamily: "'Playfair Display', serif",
                fontSize: "clamp(36px, 5.5vw, 64px)",
                fontWeight: 700,
                color: "#1A1A1A",
                margin: "0 auto 20px",
                maxWidth: 700,
                lineHeight: 1.15,
              }}
            >
              Your Money.{" "}
              <span
                style={{
                  background: "linear-gradient(135deg, #5A7C65, #8B7234)",
                  WebkitBackgroundClip: "text",
                  WebkitTextFillColor: "transparent",
                }}
              >
                Your Guide.
              </span>
            </h1>
            <p
              style={{
                fontFamily: "'DM Sans', sans-serif",
                fontSize: "clamp(16px, 2vw, 19px)",
                color: "#777",
                maxWidth: 520,
                margin: "0 auto 40px",
                lineHeight: 1.6,
              }}
            >
              Interactive tools built for where you actually are — not where a textbook thinks you should be.
            </p>
            <div style={{ display: "flex", justifyContent: "center", gap: 12, flexWrap: "wrap" }}>
              {SECTIONS.map((s) => (
                <button
                  key={s.id}
                  onClick={() => scrollTo(s.id)}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.background = s.color;
                    e.currentTarget.style.color = "#fff";
                    e.currentTarget.style.transform = "translateY(-2px)";
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.background = s.colorLight;
                    e.currentTarget.style.color = s.color;
                    e.currentTarget.style.transform = "translateY(0)";
                  }}
                  style={{
                    all: "unset",
                    cursor: "pointer",
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: 15,
                    fontWeight: 600,
                    color: s.color,
                    background: s.colorLight,
                    border: `1.5px solid ${s.colorAccent}55`,
                    padding: "12px 28px",
                    borderRadius: 100,
                    transition: "all 0.3s ease",
                    display: "flex",
                    alignItems: "center",
                    gap: 8,
                  }}
                >
                  <span>{s.emoji}</span>
                  {s.label}
                </button>
              ))}
            </div>
          </header>

          <NavPill sections={SECTIONS} active={activeSection} onSelect={scrollTo} />

          {SECTIONS.map((section, i) => (
            <div key={section.id} id={section.id}>
              <SectionBlock section={section} index={i} />
            </div>
          ))}

          <footer
            style={{
              textAlign: "center",
              padding: "60px 24px",
              background: "#1A1A1A",
              color: "#999",
              fontFamily: "'DM Sans', sans-serif",
              fontSize: 14,
            }}
          >
            <div
              style={{
                fontFamily: "'Playfair Display', serif",
                fontSize: 20,
                fontWeight: 700,
                color: "#fff",
                marginBottom: 8,
              }}
            >
              The Affluence Project
            </div>
            <p style={{ margin: "0 0 4px 0" }}>
              Creating generational wealth through mentorship, networking & advocacy.
            </p>
            <p style={{ margin: 0, fontSize: 12, color: "#666" }}>
              © 2026 The Affluence Project. All rights reserved.
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TAPGuidesHome />);
  </script>
</body>
</html>
