              ) : null}
              {section.tiles.map((tile, i) => (
                <TileCard key={tile.title + (tile.subtitle || "")} tile={tile} section={section} delay={i * 0.08} visible={visible} isMobile={isMobile} />
              ))}
            </div>
          </div>
        </section>
      );
    }

    function MainSiteFixedBar() {
      var isMobile = useMediaQueryMobile();
      return (
        <div
          style={{
            position: "fixed",
            top: 0,
            left: 0,
            right: 0,
            zIndex: 150,
            paddingTop: "calc(10px + env(safe-area-inset-top, 0px))",
            paddingBottom: 10,
            paddingLeft: 16,
            paddingRight: 16,
            background: "rgba(253, 252, 250, 0.92)",
            backdropFilter: "blur(16px)",
            WebkitBackdropFilter: "blur(16px)",
            borderBottom: "1px solid #E8E4DE",
            display: "flex",
            alignItems: "center",
            justifyContent: "flex-start",
            boxSizing: "border-box",
          }}
        >
          <a
            href="https://theaffluenceproject.org"
            rel="noopener noreferrer"
            aria-label="The Affluence Project — return to main website"
            style={{
              fontFamily: "'DM Sans', sans-serif",
              fontSize: isMobile ? 13 : 14,
              fontWeight: 600,
              color: "#5A7C65",
              background: "#fff",
              border: "1.5px solid #E8E4DE",
              borderRadius: 100,
              padding: isMobile ? "11px 18px" : "10px 20px",
              minHeight: 44,
              lineHeight: 1.25,
              textDecoration: "none",
              display: "inline-flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              flexShrink: 0,
              whiteSpace: "nowrap",
              boxSizing: "border-box",
            }}
          >
            ← Main site
          </a>
        </div>
      );
    }

    function NavPill({ sections, active, onSelect }) {
      const isMobile = useMediaQueryMobile();
      const [menuOpen, setMenuOpen] = useState(false);
      const [searchQ, setSearchQ] = useState("");

      const filteredSearch = useMemo(() => {
        const t = searchQ.trim().toLowerCase();
        if (!t) return [];
        return SITE_SEARCH_LINKS.filter(
          (l) =>
            l.title.toLowerCase().includes(t) ||
            l.kw.includes(t) ||
            l.kw.split(" ").some((w) => w.includes(t))
        ).slice(0, 8);
      }, [searchQ]);

      const handleNavClick = (id) => {
        onSelect(id);
        setMenuOpen(false);
      };

      const navButtons = (compact) =>
        sections.map((s) => (
          <button
            key={s.id}
            type="button"
            aria-current={active === s.id ? "true" : undefined}
            onClick={() => handleNavClick(s.id)}
            style={{
              all: "unset",
              cursor: "pointer",
              fontFamily: "'DM Sans', sans-serif",
              fontSize: compact ? 15 : 13,
              fontWeight: active === s.id ? 700 : 500,
              color: active === s.id ? s.color : "#888",
              padding: compact ? "14px 16px" : "8px 16px",
              minHeight: compact ? 48 : undefined,
              borderRadius: 100,
              background: active === s.id ? `${s.colorLight}` : "transparent",
              transition: "all 0.25s ease",
              whiteSpace: "nowrap",
              display: "flex",
              alignItems: "center",
              width: compact ? "100%" : "auto",
              boxSizing: "border-box",
            }}
          >
            <span style={{ display: "inline-flex", alignItems: "center", marginRight: 6 }}>
              <Icon name={s.sectionIcon} size={15} color={active === s.id ? s.color : "#888"} />
            </span>
            {s.navShortLabel || s.label}
          </button>
        ));

      return (
        <div
          style={{
            position: "sticky",
            top: MAIN_SITE_BAR_STICKY_TOP,
            zIndex: 100,
            background: "rgba(253, 252, 250, 0.92)",
            backdropFilter: "blur(16px)",
            WebkitBackdropFilter: "blur(16px)",
            borderBottom: "1px solid #E8E4DE",
            padding: isMobile ? "0 16px" : "0 24px",
          }}
        >
          <div
            style={{
              maxWidth: 1120,
              margin: "0 auto",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              minHeight: isMobile ? 52 : 56,
              flexWrap: "wrap",
              gap: isMobile ? 10 : 8,
              padding: isMobile ? "10px 0" : "8px 0",
            }}
          >
            <div
              style={{
                fontFamily: "'Playfair Display', serif",
                fontSize: isMobile ? 17 : 18,
                fontWeight: 700,
                color: "#1A1A1A",
                display: "flex",
                alignItems: "center",
                gap: 8,
                flexShrink: 0,
                flexWrap: "wrap",
                maxWidth: isMobile ? "min(100%, 200px)" : undefined,
              }}
            >
              <span
                style={{
                  background: "linear-gradient(135deg, #5A7C65, #8B7234)",
                  WebkitBackgroundClip: "text",
                  WebkitTextFillColor: "transparent",
                }}
              >
                TAP
              </span>
              {!isMobile ? (
                <span style={{ color: "#999", fontWeight: 400, fontSize: 14, fontFamily: "'DM Sans', sans-serif" }}>
                  Interactive Guides
                </span>
              ) : null}
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, justifyContent: "flex-end", flexWrap: "wrap", minWidth: 0 }}>
              <div style={{ position: "relative", minWidth: isMobile ? 0 : 160, maxWidth: isMobile ? "100%" : 220, flex: isMobile ? "1 1 160px" : "1 1 140px" }}>
                <label htmlFor="site-search" className="visually-hidden">
                  Search pages and tools
                </label>
                <input
                  id="site-search"
                  type="search"
                  placeholder="Search…"
                  value={searchQ}
                  onChange={(e) => setSearchQ(e.target.value)}
                  autoComplete="off"
                  style={{
                    width: "100%",
                    fontFamily: "'DM Sans', sans-serif",
                    fontSize: isMobile ? 16 : 13,
                    padding: isMobile ? "11px 14px" : "8px 12px",
                    minHeight: isMobile ? 44 : undefined,
                    border: "1.5px solid #E8E4DE",
                    borderRadius: 100,
                    background: "#fff",
                    outline: "none",
                    boxSizing: "border-box",
                  }}
                />
                {filteredSearch.length > 0 ? (
                  <ul
                    role="listbox"
                    style={{
                      position: "absolute",
                      top: "100%",
                      left: 0,
                      right: 0,
                      margin: "4px 0 0 0",
                      padding: 8,
                      listStyle: "none",
                      background: "#fff",
                      border: "1.5px solid #E8E4DE",
                      borderRadius: 12,
                      boxShadow: "0 12px 32px rgba(0,0,0,0.12)",
                      zIndex: 200,
                      maxHeight: 280,
                      overflowY: "auto",
                    }}
                  >
                    {filteredSearch.map((item) => (
                      <li key={item.href + item.title}>
                        <a
                          href={item.href}
                          role="option"
                          style={{
                            display: "block",
                            padding: "8px 10px",
                            fontSize: 13,
                            color: "#333",
                            textDecoration: "none",
                            borderRadius: 8,
                          }}
                          onMouseEnter={(e) => {
                            e.currentTarget.style.background = "#F7F3EA";
                          }}
                          onMouseLeave={(e) => {
                            e.currentTarget.style.background = "transparent";
                          }}
                        >
                          {item.title}
                        </a>
                      </li>
                    ))}
                  </ul>
                ) : null}
              </div>

              {isMobile ? (
                <>
                  <button
                    type="button"
                    aria-expanded={menuOpen}
                    aria-controls="mobile-section-nav"
                    aria-label={menuOpen ? "Close section menu" : "Open section menu"}
                    onClick={() => setMenuOpen((o) => !o)}
                    style={{
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: 14,
                      fontWeight: 600,
                      color: "#8B7234",
                      background: "#F7F3EA",
                      border: "1.5px solid #E8E4DE",
                      borderRadius: 100,
                      padding: "11px 18px",
                      minHeight: 44,
                      cursor: "pointer",
                      flexShrink: 0,
                    }}
                  >
                    {menuOpen ? "Close" : "Sections"}
                  </button>
                </>
              ) : null}
            </div>
          </div>

          {!isMobile ? (
            <nav aria-label="Site sections" style={{ maxWidth: 1120, margin: "0 auto", padding: "0 24px 10px", display: "flex", gap: 4, flexWrap: "wrap", justifyContent: "flex-end" }}>
              {navButtons(false)}
            </nav>
          ) : null}

          {isMobile && menuOpen ? (
            <nav id="mobile-section-nav" aria-label="Site sections" style={{ maxWidth: 1120, margin: "0 auto", padding: "0 16px 16px", display: "flex", flexDirection: "column", gap: 6 }}>
              {navButtons(true)}
            </nav>
          ) : null}
        </div>
      );
    }

    function TAPGuidesHome() {
      const [activeSection, setActiveSection] = useState(null);
      const [tierDrawerOpen, setTierDrawerOpen] = useState(false);
      const isMobile = useMediaQueryMobile();
      var ypSection = SECTIONS.find(function (s) { return s.id === "young-professionals"; });

      useEffect(function () {
        if (!tierDrawerOpen) return;
        function onKey(e) { if (e.key === "Escape") setTierDrawerOpen(false); }
        window.addEventListener("keydown", onKey);
        return function () { window.removeEventListener("keydown", onKey); };
      }, [tierDrawerOpen]);

      useEffect(function () {
        if (!tierDrawerOpen) return;
        var prev = document.body.style.overflow;
        document.body.style.overflow = "hidden";
        return function () { document.body.style.overflow = prev; };
      }, [tierDrawerOpen]);

      useEffect(function () {
        if (!tierDrawerOpen) return;
        var tid = window.setTimeout(function () {
          var el = document.getElementById("tier-drawer-close");
          if (el) el.focus();
        }, 50);
        return function () { window.clearTimeout(tid); };
      }, [tierDrawerOpen]);

      useEffect(function () {
        var meta = document.querySelector('meta[name="description"]');
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", "description");
          document.head.appendChild(meta);
        }
        meta.setAttribute(
          "content",
          "TAP Interactive Guides: tools and guides for students, young professionals, and parents. Budget, housing, career, benefits, and more."
        );
      }, []);

      const scrollTo = (id) => {
        setActiveSection(id);
        var el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        try {
          if (typeof history !== "undefined" && history.replaceState) {
            history.replaceState(null, "", "#" + encodeURIComponent(id));
          } else {
            window.location.hash = id;
          }
        } catch (e) {
          window.location.hash = id;
        }
      };

      useEffect(function () {
        function applyHash() {
          var raw = window.location.hash.replace(/^#/, "");
          if (!raw) return;
          var id = decodeURIComponent(raw);
          if (SECTIONS.some(function (s) { return s.id === id; })) {
            setActiveSection(id);
            setTimeout(function () {
              var el = document.getElementById(id);
              if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 80);
          }
        }
        applyHash();
        window.addEventListener("hashchange", applyHash);
        return function () {
          window.removeEventListener("hashchange", applyHash);
        };
      }, []);

      useEffect(() => {
        const handler = () => {
          for (const s of SECTIONS) {
            const el = document.getElementById(s.id);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top < 300 && rect.bottom > 200) {
                setActiveSection(s.id);
                break;
              }
            }
          }
        };
        window.addEventListener("scroll", handler, { passive: true });
        return () => window.removeEventListener("scroll", handler);
      }, []);

      return (
        <div style={{ background: "#FDFCFA", minHeight: "100vh" }}>
          <style>{`
            .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
            a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #8B7234; outline-offset: 2px; }
            .skip-link { position: absolute; left: -9999px; z-index: 9999; padding: 12px 20px; background: #1A1A1A; color: #fff; font-weight: 600; text-decoration: none; border-radius: 0 0 8px 0; }
            .skip-link:focus { left: 16px; top: calc(64px + env(safe-area-inset-top, 0px)); }
          `}</style>
          <MainSiteFixedBar />
          <a href="#main-content" className="skip-link">
            Skip to main content
          </a>
          <header
            style={{
              position: "relative",
              minHeight: isMobile ? "min(100dvh, 100vh)" : "100vh",
              display: "flex",
              flexDirection: "column",
              alignItems: "center",
              justifyContent: "center",
              textAlign: "center",
              overflow: "hidden",
              background: "linear-gradient(180deg, #FDFCFA 0%, #F5F1EB 100%)",
              padding: isMobile
                ? "calc(64px + env(safe-area-inset-top, 0px) + 24px) 16px max(28px, env(safe-area-inset-bottom, 0px))"
                : "calc(64px + env(safe-area-inset-top, 0px) + 24px) 24px 40px",
            }}
          >
            <div style={{ position: "absolute", top: -60, left: "10%", width: 240, height: 240, borderRadius: "50%", background: "radial-gradient(circle, #A8C5B015, transparent 70%)", pointerEvents: "none" }} />
            <div style={{ position: "absolute", bottom: -40, right: "15%", width: 180, height: 180, borderRadius: "50%", background: "radial-gradient(circle, #D4BA6A12, transparent 70%)", pointerEvents: "none" }} />
            <div style={{ display: "inline-block", fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: 600, letterSpacing: "0.12em", textTransform: "uppercase", color: "#8B7234", background: "#8B723412", padding: "6px 18px", borderRadius: 100, marginBottom: 24 }}>The Affluence Project</div>
            <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: "clamp(36px, 5.5vw, 64px)", fontWeight: 700, color: "#1A1A1A", margin: "0 auto 20px", maxWidth: 700, lineHeight: 1.15 }}>
              Your Money.{" "}
              <span style={{ background: "linear-gradient(135deg, #5A7C65, #8B7234)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>Your Guide.</span>
            </h1>
            <p style={{ fontFamily: "'DM Sans', sans-serif", fontSize: "clamp(16px, 2vw, 19px)", color: "#777", maxWidth: 520, margin: "0 auto 40px", lineHeight: 1.6 }}>
              Interactive tools built for where you actually are, not where a textbook thinks you should be.
            </p>
            <div
              style={{
                display: isMobile ? "grid" : "flex",
                gridTemplateColumns: isMobile ? "repeat(2, minmax(0, 1fr))" : undefined,
                justifyContent: "center",
                gap: isMobile ? 10 : 12,
                flexWrap: "wrap",
                width: "100%",
                maxWidth: isMobile ? 420 : undefined,
                boxSizing: "border-box",
              }}
            >
              {SECTIONS.map(function (s) {
                return (
                  <button key={s.id} onClick={function () { scrollTo(s.id); }}
                    onMouseEnter={function (e) { e.currentTarget.style.background = s.color; e.currentTarget.style.color = "#fff"; e.currentTarget.style.transform = "translateY(-2px)"; }}
                    onMouseLeave={function (e) { e.currentTarget.style.background = s.colorLight; e.currentTarget.style.color = s.color; e.currentTarget.style.transform = "translateY(0)"; }}
                    style={{
                      all: "unset",
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      fontSize: isMobile ? 14 : 15,
                      fontWeight: 600,
                      color: s.color,
                      background: s.colorLight,
                      border: "1.5px solid " + s.colorAccent + "55",
                      padding: isMobile ? "12px 14px" : "12px 28px",
                      minHeight: isMobile ? 48 : undefined,
                      borderRadius: 100,
                      transition: "all 0.3s ease",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      gap: 8,
                      boxSizing: "border-box",
                      width: isMobile ? "100%" : "auto",
                    }}
                  >
                    <Icon name={s.sectionIcon} size={18} color="currentColor" />
                    {s.navShortLabel || s.label}
                  </button>
                );
              })}
            </div>
            <div style={{ position: "absolute", bottom: isMobile ? "max(16px, env(safe-area-inset-bottom, 0px))" : 28, left: "50%", transform: "translateX(-50%)", display: "flex", flexDirection: "column", alignItems: "center", gap: 6, animation: "heroFloat 2s ease-in-out infinite" }}>
              <style>{"@keyframes heroFloat { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(6px); } }"}</style>
              <span style={{ fontFamily: "'DM Sans', sans-serif", fontSize: 12, fontWeight: 500, color: "#bbb", letterSpacing: "0.04em" }}>Scroll to explore</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bbb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M19 12l-7 7-7-7" /></svg>
            </div>
          </header>

          <div style={{ maxWidth: 1120, margin: "0 auto", padding: isMobile ? "24px 16px 8px" : "32px 24px 8px" }}>
            <GoalIntentStrip onScrollTo={scrollTo} onOpenTierCalculator={function () { setTierDrawerOpen(true); }} />
          </div>

          <AudiencePathStrip />

          <NavPill sections={SECTIONS} active={activeSection} onSelect={scrollTo} />

          <main id="main-content">
            {SECTIONS.map((section, i) => (
              <div key={section.id} id={section.id}>
                <SectionBlock section={section} index={i} />
              </div>
            ))}
          </main>

          {tierDrawerOpen && ypSection ? (
            <>
              <div role="presentation" aria-hidden="true" onClick={function () { setTierDrawerOpen(false); }} style={{ position: "fixed", inset: 0, zIndex: 180, background: "rgba(26, 26, 26, 0.45)", WebkitBackdropFilter: "blur(4px)", backdropFilter: "blur(4px)" }} />
              <div role="dialog" aria-modal="true" aria-labelledby="tier-drawer-title" style={{ position: "fixed", top: 0, right: 0, bottom: 0, width: "min(100vw, 440px)", zIndex: 200, background: "#FDFCFA", boxShadow: "-12px 0 48px rgba(0,0,0,0.18)", display: "flex", flexDirection: "column", paddingTop: "env(safe-area-inset-top, 0px)", paddingBottom: "env(safe-area-inset-bottom, 0px)", animation: "tierDrawerSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards" }}>
                <style>{"@keyframes tierDrawerSlide { from { transform: translateX(100%); opacity: 0.96; } to { transform: translateX(0); opacity: 1; } }"}</style>
                <div style={{ overflowY: "auto", flex: 1, WebkitOverflowScrolling: "touch", padding: isMobile ? "8px 12px 28px" : "12px 16px 20px" }}>
                  <NetWorthCalculator embed={true} onRequestClose={function () { setTierDrawerOpen(false); }} sectionColor={ypSection.color} colorLight={ypSection.colorLight} colorAccent={ypSection.colorAccent} panelId="tier-calculator-panel-hub-drawer" />
                </div>
              </div>
            </>
          ) : null}

          <footer
            style={{
              textAlign: "center",
              padding: isMobile ? "40px 16px max(32px, env(safe-area-inset-bottom, 0px))" : "60px 24px",
              background: "#1A1A1A",
              color: "#999",
              fontFamily: "'DM Sans', sans-serif",
              fontSize: isMobile ? 13 : 14,
            }}
          >
            <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 20, fontWeight: 700, color: "#fff", marginBottom: 8 }}>The Affluence Project</div>
            <p style={{ margin: "0 0 4px 0" }}>
              Creating generational wealth through mentorship, networking & advocacy.
            </p>
            <p style={{ margin: "16px auto 0", maxWidth: 560, fontSize: 13, color: "#888", lineHeight: 1.55 }}>
              TAP Interactive Guides are educational tools and readings. They are not personalized financial, legal, or tax advice. Referrals and programs may have eligibility rules; always confirm details that matter to you.
            </p>
            <p style={{ margin: "12px 0 0 0", fontSize: 12, color: "#666" }}>
              © {new Date().getFullYear()} The Affluence Project. All rights reserved.
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TAPGuidesHome />);
  </script>
</body>
</html>
